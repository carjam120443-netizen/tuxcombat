name: Build and Release Tux Combat

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows and Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.4.1-stable"
          GODOT_SHORT="4.4.1"
          mkdir -p "$HOME/.local/bin"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"             -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          godot --version

      - name: Install matching export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.4.1-stable"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"             -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/TuxCombat.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux/X11" build/linux/TuxCombat.x86_64
          chmod +x build/linux/TuxCombat.x86_64

      - name: Package builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd build
          zip -qr ../dist/TuxCombat-Windows.zip windows
          tar -czf ../dist/TuxCombat-Linux.tar.gz linux
          cd ..
          sha256sum dist/TuxCombat-Windows.zip dist/TuxCombat-Linux.tar.gz > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Create Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "windows-${{ github.run_number }}"             dist/TuxCombat-Windows.zip             --title "Tux Combat Windows Build ${{ github.run_number }}"             --notes "Automated Windows build from commit ${{ github.sha }}."

      - name: Create Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "linux-${{ github.run_number }}"             dist/TuxCombat-Linux.tar.gz             --title "Tux Combat Linux Build ${{ github.run_number }}"             --notes "Automated Linux build from commit ${{ github.sha }}."

      - name: Create checksums release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "checksums-${{ github.run_number }}"             dist/SHA256SUMS.txt             --title "Tux Combat Checksums ${{ github.run_number }}"             --notes "SHA-256 checksums for the Windows and Linux builds from commit ${{ github.sha }}."
